# Windows：控制面 Node Agent（上报 GPU/CPU 等到 iot-node）
# docker compose -f docker-compose.win.yml up -d
services:
  node-agent:
    image: ai-service:latest
    container_name: easyaiot-node-agent
    working_dir: /opt/easyaiot/node-agent
    command: ["python", "run_agent.py"]
    gpus: all
    runtime: nvidia
    environment:
      - TZ=Asia/Shanghai
      - PLATFORM_AGENT=1
      - NODE_ID=1
      - AGENT_TOKEN=feba85c09c7a4b0db169d7d2b0630ba3
      - CONTROL_PLANE_URL=http://iot-gateway:48080/admin-api/node/agent
      - AGENT_LISTEN_PORT=9100
      - HEARTBEAT_INTERVAL=10
      - NVIDIA_VISIBLE_DEVICES=all
      - BOOTSTRAP_WAIT_SECONDS=30
    volumes:
      - ../NODE:/opt/easyaiot/node-agent
    ports:
      - "0.0.0.0:9100:9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - easyaiot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  easyaiot-network:
    name: easyaiot-network
    external: true
